# Template server nginx. Disalin ke /etc/nginx/templates/default.conf.template oleh Dockerfile.
# __API_ORIGIN__ diganti saat build dengan VITE_API_BASE_URL, jadi connect-src di CSP selalu
# sama dengan origin yang ditanam di bundle. ${PORT} diisi saat container start oleh entrypoint nginx.
server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Header keamanan (security.rules.md). Tanpa unsafe-inline dan unsafe-eval.
  # Jangan menaruh add_header di dalam location: satu add_header di location membuang semua
  # add_header di level server. Caching memakai expires, yang tidak punya masalah itu.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' __API_ORIGIN__; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Aset ber-hash: aset yang hilang harus 404, bukan salinan index.html bertipe JavaScript.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # Berkas yang mengarahkan browser ke versi baru tidak boleh tertahan di cache.
  location = /index.html {
    expires -1;
  }

  location = /sw.js {
    expires -1;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
  }

  # Fallback SPA: setiap path lain mengembalikan index.html supaya refresh di rute dalam tidak 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
